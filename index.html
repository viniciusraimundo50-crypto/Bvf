<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVF Log Transportes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0004ff;
            font-family: Arial, sans-serif;
        }

        .entrada {
            text-align: center;
        }

        .logo-img {
            width: 500px;
            max-width: 90vw;
            display: block;
            margin: 0 auto 35px;
        }

        .botao {
            display: inline-block;
            padding: 15px 45px;
            background: #ffffff;
            color: #0004ff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao:hover {
            background: #0004ff;
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <main class="entrada">

        <img 
            src="BVF LOG sem fundo.png"
            alt="BVF Log Transportes"
            class="logo-img"
        >

        <a href="pag02.html" class="botao">ENTRAR</a>

    </main>

</body>
</html>
